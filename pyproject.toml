[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-keydiff"
version = "0.1.0"
description = "Compare CSV snapshots by composite keys with deterministic reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "edwei06"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
csv-keydiff = "csv_keydiff.cli:main"

[tool.setuptools.packages.find]
include = ["csv_keydiff*"]
